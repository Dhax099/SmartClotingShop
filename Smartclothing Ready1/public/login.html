<!DOCTYPE html>
<html lang="en">

<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Login</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/monochrome-theme.css">
  
</head>


<body>
  
  
  <!-- para sa logo tas navigation buttons -->
  
  <header class="header">
    <a href="index.html" class="logo">Smart<span> Clothing</span></a>
    <a href="index.html" class="home">Home</a>
  </header>
  
  <main class="main">
    
    <div class="card">
      <div class="title">
        <h1>Welcome Back</h1>
        <p>Login to your Smart Clothing account. Admin accounts use this same login.</p>
      </div>
      
      
      <div id="message" class="message">
      </div>
      
      <form id="loginForm" novalidate>
        <label>Email Address</label>

        <input type="email" id="email" placeholder="Enter your email" required>
        <label>Password</label>
        
        <div class="password-field">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        
        
        <a href="forgot-password.html" class="forgot">Forgot password?</a>
        <label class="remember">
          <input type="checkbox" id="remember">Remember me
        </label>
        <button type="submit" class="login-btn">Login</button>
        
        
      </form>
      
      
      <div class="register-text">
        
        Don't have an account?
        
        <a href="register.html">
          Create Account
        </a>
        
      </div>
      
    </div>
    
  </main>
  
  
  <footer class="footer">
    
    <strong>
      Smart Clothing
    </strong>
    
    <p>
      Buy products. Sell products. Grow together.
    </p>
    
  </footer>
  
  
  
  <script src="js/login.js"></script>
  
</body>

</html>
