<!DOCTYPE html>
<html lang="en">

<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Create Account</title>
  
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/monochrome-theme.css">
  
</head>

<body>
  
  
  <header class="header">
    
    <a href="index.html" class="logo">
      Smart<span> Clothing</span>
    </a>
    
    <a href="index.html" class="home">
      Home
    </a>
    
  </header>
  
  
  <main class="main">
    
    <div class="card">
      
      <div class="title">
        
        <h1>
          Create Account
        </h1>
        
        <p>
          Create an account to shop the latest clothing collection.
        </p>
        
      </div>
      
      
      <div id="message" class="message">
      </div>
      
      
      <form id="registerForm" novalidate>
        
        
        <label>
          Full Name
        </label>
        
        <input type="text" id="name" placeholder="Enter your full name" required>
        
        
        <label>
          Email Address
        </label>
        
        <input type="email" id="email" placeholder="example@email.com" required>
        
        
        <label>
          Phone Number
        </label>
        
        <input type="tel" id="phone" placeholder="09XXXXXXXXX or +639XXXXXXXXX" required>
        
        
        <label>
          Password
        </label>
        
        <div class="password-field">
          <input type="password" id="password" placeholder="Create a password" required>
          <button type="button" class="password-toggle" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        
        <button type="submit" class="create">
        
          Create Account
          
        </button>
        
        
      </form>
      
      
      <div class="login-text">
        
        Already have an account?
        
        <a href="login.html">
          Login
        </a>
        
      </div>
      
    </div>
    
  </main>
  
  
  <footer class="footer">
    
    <strong>
      Smart Clothing
    </strong>
    
    <p>
      Shop your best style here on smart clothing.
    </p>
    
  </footer>
  
  
  <script src="js/register.js"></script>
  
</body>

</html>
