<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/forgot-password.css">
  <link rel="stylesheet" href="css/monochrome-theme.css">

</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <a href="index.html" class="logo">Smart<span> Clothing</span></a>
    <a href="login.html" class="home">Back to Login</a>

  </header>

  <main class="main">
    <div class="card">
      <div class="title">
        <h1>Forgot Password?</h1>
        <p id="subtitle">Enter the email address you used when you registered. We’ll send you a verification code.</p>
      </div>

      <!-- error / success message shows here -->
      <div id="message" class="message"></div>

      <!-- STEP 1: request a code for the account -->
      <form id="verifyForm" novalidate>
        <label for="email">Email Address</label>
        <input type="email" id="email" autocomplete="email" placeholder="Enter your email" required>
        <button type="submit" class="login-btn">Send Verification Code</button>
      </form>

      <!-- STEP 2: email verification code -->
      <form id="otpForm" novalidate hidden>
        <label for="otp">Email verification code</label>
        <input type="text" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter the 6-digit code" required>
        <button type="submit" class="login-btn">Verify Code</button>
        <button type="button" class="resend-btn" id="resendCode">Resend code</button>
      </form>


      <!-- STEP 3: new password (hidden at first) -->
      <form id="resetForm" novalidate hidden>
        <label>New Password</label>
        <div class="password-field">
          <input type="password" id="newPassword" placeholder="Enter new password" required>
          <button type="button" class="password-toggle" id="toggleNew" aria-label="Show password">Show</button>
        </div>

        <label>Confirm New Password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="Type it again" required>
          <button type="button" class="password-toggle" id="toggleConfirm" aria-label="Show password">Show</button>
        </div>

        <p class="hint">Password must be at least 6 characters.</p>
        <button type="submit" class="login-btn">Change Password</button>
      </form>


      <div class="back-text">
        Remembered it?
        <a href="login.html">Login</a>
      </div>
    </div>
  </main>


  <footer class="footer">
    <strong>Smart Clothing</strong>
    <p>Shop your best style here on smart clothing.</p>
  </footer>

  <script src="js/forgot-password.js"></script>

</body>

</html>
